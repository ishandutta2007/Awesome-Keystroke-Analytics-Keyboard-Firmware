<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="keycapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #9ca3af;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
      .key-legend {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #94a3b8;
      }

      /* Animated Elements */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-25px, 20px); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(30px, -20px); }
      }
      @keyframes keypressWave {
        0%, 100% { fill-opacity: 0.2; stroke-opacity: 0.4; }
        50% { fill-opacity: 0.8; stroke-opacity: 1; stroke: #38bdf8; }
      }
      @keyframes signalFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .animated-orb1 {
        animation: pulseGlow 8s ease-in-out infinite, floatOrb 12s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-orb2 {
        animation: pulseGlow 10s ease-in-out infinite, floatOrb2 14s ease-in-out infinite;
        transform-origin: center;
      }
      .key-active1 {
        animation: keypressWave 3s ease-in-out infinite;
      }
      .key-active2 {
        animation: keypressWave 4s ease-in-out infinite 1s;
      }
      .key-active3 {
        animation: keypressWave 3.5s ease-in-out infinite 2s;
      }
      .flow-line {
        stroke-dasharray: 12 8;
        animation: signalFlow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Matrix / Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" />
    </pattern>
    <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  </g>

  <!-- Background Glowing Ambient Orbs (Far back layer) -->
  <g>
    <circle class="animated-orb1" cx="200" cy="100" r="160" fill="#6366f1" opacity="0.25" filter="url(#softGlow)" />
    <circle class="animated-orb2" cx="1020" cy="300" r="180" fill="#ec4899" opacity="0.2" filter="url(#softGlow)" />
    <circle class="animated-orb1" cx="900" cy="100" r="140" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)" />
  </g>

  <!-- Dynamic Animated Signal Flow Streamline (Behind text) -->
  <path class="flow-line" d="M -50,330 C 300,250 450,390 750,310 C 950,260 1100,340 1250,290" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" opacity="0.4" />
  <path class="flow-line" d="M -50,350 C 250,280 500,420 800,330 C 1000,280 1150,360 1250,310" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.3" />

  <!-- Decorative Mechanical Keyboard Switch & Heatmap Matrix Visualization (Right Side) -->
  <g transform="translate(850, 100)" opacity="0.85">
    <!-- Switch Matrix Frame -->
    <rect x="0" y="0" width="280" height="190" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="30" class="badge-text" fill="#64748b">INPUT TELEMETRY MATRIX</text>
    <circle cx="255" cy="25" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Keycap grid with simulated telemetry heat levels -->
    <!-- Row 1 -->
    <rect x="20" y="50" width="38" height="38" rx="6" fill="url(#keycapGrad)" stroke="#475569" stroke-width="1" />
    <text x="33" y="73" class="key-legend">ESC</text>

    <rect x="66" y="50" width="38" height="38" rx="6" class="key-active1" fill="#6366f1" stroke="#818cf8" stroke-width="1.5" />
    <text x="81" y="73" class="key-legend" fill="#ffffff">Q</text>

    <rect x="112" y="50" width="38" height="38" rx="6" class="key-active2" fill="#ec4899" stroke="#f472b6" stroke-width="1.5" />
    <text x="126" y="73" class="key-legend" fill="#ffffff">W</text>

    <rect x="158" y="50" width="38" height="38" rx="6" class="key-active1" fill="#38bdf8" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="173" y="73" class="key-legend" fill="#ffffff">E</text>

    <rect x="204" y="50" width="56" height="38" rx="6" fill="url(#keycapGrad)" stroke="#475569" stroke-width="1" />
    <text x="217" y="73" class="key-legend">BACK</text>

    <!-- Row 2 -->
    <rect x="20" y="96" width="46" height="38" rx="6" fill="url(#keycapGrad)" stroke="#475569" stroke-width="1" />
    <text x="31" y="119" class="key-legend">TAB</text>

    <rect x="74" y="96" width="38" height="38" rx="6" class="key-active3" fill="#a855f7" stroke="#c084fc" stroke-width="1.5" />
    <text x="88" y="119" class="key-legend" fill="#ffffff">A</text>

    <rect x="120" y="96" width="38" height="38" rx="6" class="key-active1" fill="#ec4899" stroke="#f472b6" stroke-width="1.5" />
    <text x="134" y="119" class="key-legend" fill="#ffffff">S</text>

    <rect x="166" y="96" width="38" height="38" rx="6" class="key-active2" fill="#6366f1" stroke="#818cf8" stroke-width="1.5" />
    <text x="180" y="119" class="key-legend" fill="#ffffff">D</text>

    <rect x="212" y="96" width="48" height="38" rx="6" fill="url(#keycapGrad)" stroke="#475569" stroke-width="1" />
    <text x="221" y="119" class="key-legend">RET</text>

    <!-- Row 3 -->
    <rect x="20" y="142" width="60" height="34" rx="6" fill="url(#keycapGrad)" stroke="#475569" stroke-width="1" />
    <text x="34" y="163" class="key-legend">FN</text>

    <rect x="88" y="142" width="104" height="34" rx="6" class="key-active1" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5" />
    <text x="124" y="163" class="key-legend" fill="#ffffff">SPACE</text>

    <rect x="200" y="142" width="60" height="34" rx="6" fill="url(#keycapGrad)" stroke="#475569" stroke-width="1" />
    <text x="214" y="163" class="key-legend">ALT</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle & Interactive Feature Pills -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4.5" fill="#a855f7" />
      <text x="28" y="21" class="badge-text" fill="#c7d2fe">✨ CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title (Gradient Fill, Crisp & Bold in Foreground) -->
    <g transform="translate(0, 155)">
      <text class="title-text" fill="#f8fafc">
        Keystroke Analytics &amp;
      </text>
      <text y="52" class="title-text" fill="url(#primaryGlow)">
        Keyboard Firmware
      </text>
    </g>

    <!-- Subtitle (Crisp Foreground, Legible) -->
    <g transform="translate(0, 248)">
      <text class="subtitle-text">
        The ultimate index of mechanical keyboard firmwares (QMK, ZMK, KMK),
      </text>
      <text y="26" class="subtitle-text">
        keystroke telemetry, WebHID configurators, Hall-effect utilities &amp; RGB suites.
      </text>
    </g>

    <!-- Highlighted Feature Badges / Pills -->
    <g transform="translate(0, 318)">
      <!-- Pill 1: QMK / ZMK / RMK -->
      <g transform="translate(0, 0)">
        <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#38bdf8" />
        <text x="28" y="23" class="badge-text" fill="#e2e8f0">⌨️ Firmware</text>
      </g>

      <!-- Pill 2: Keystroke Telemetry -->
      <g transform="translate(155, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#ec4899" />
        <text x="28" y="23" class="badge-text" fill="#e2e8f0">📊 Input Analytics</text>
      </g>

      <!-- Pill 3: WebHID & Config -->
      <g transform="translate(345, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#a855f7" />
        <text x="28" y="23" class="badge-text" fill="#e2e8f0">⚡ WebHID &amp; VIA</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(525, 0)">
        <rect width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#10b981" />
        <text x="28" y="23" class="badge-text" fill="#e2e8f0">🌟 100% Open FOSS</text>
      </g>
    </g>
  </g>

  <!-- Sleek Bottom Border Highlight -->
  <rect x="0" y="416" width="1200" height="4" rx="2" fill="url(#primaryGlow)" />
</svg>
